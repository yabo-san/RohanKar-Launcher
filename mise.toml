[tools]
node = "24"
gh = "latest"
pre-commit = "latest"
trivy = "latest"

[tasks.lint]
description = "ESLint and a syntax check of src, as the check job runs them"
run = [
  "npm run lint",
  "find src -name '*.js' -print0 | xargs -0 -n1 node --check",
]

[tasks.test]
description = "Unit tests with the 80% coverage gate"
run = "npm run test:coverage"

[tasks.e2e]
description = "Playwright e2e under xvfb, archive.org served from e2e/fixtures"
run = "xvfb-run -a npm run test:e2e"

[tasks.build-dir]
description = "Unpacked Linux build in dist/linux-unpacked (no installer)"
run = "npx electron-builder --linux --dir --publish never"
