[tools]
node = "24"
gh = "latest"
pre-commit = "latest"
trivy = "latest"

[tasks.lint]
description = "ESLint and a syntax check of src, as the check job runs them"
run = [
  "npm run lint",
  "find src -name '*.js' -print0 | xargs -0 -n1 node --check",
]

[tasks.backend]
description = "The standalone backend on 127.0.0.1:5170 (token dev, data in .launcher-data)"
run = "node scripts/dev.js backend"

[tasks.frontend]
description = "src/frontend on 127.0.0.1:5173, pointed at the backend task"
run = "node scripts/dev.js frontend"

[tasks.dev]
description = "Backend and frontend together in one process; prints the page URLs"
run = "node scripts/dev.js"

[tasks.ui]
description = "The UI in a browser on 0.0.0.0:5180 from the real data saved as JSON, no backend and no installs; --offline for the e2e fixtures"
run = "node scripts/ui.js"

[tasks.sandbox]
description = "The real backend and UI with real installs, everything under ./sandbox/; --reset empties it"
run = "node scripts/sandbox.js"

[tasks.test]
description = "Unit and API tests with the 80% coverage gate"
run = "npm run test:coverage"

[tasks.e2e]
description = "Browser e2e: the frontend in headless Chromium, archive.org served from e2e/fixtures"
run = "npm run test:e2e"

[tasks.smoke]
description = "The packaged smoke test against the unpacked Linux build, under xvfb"
depends = ["build-dir"]
env = { E2E_APP = "dist/linux-unpacked/rohankar-launcher" }
run = "xvfb-run -a npx playwright test"

[tasks.build-dir]
description = "Unpacked Linux build in dist/linux-unpacked (no installer)"
run = "npx electron-builder --linux --dir --publish never"
