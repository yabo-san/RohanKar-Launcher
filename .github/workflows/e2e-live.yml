name: E2E live sources

# Same e2e test against the real archive.org, so a source that stops returning
# games shows up here. Not a PR check: live network results can flake.
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e-live:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # E2E_SOURCES holds the full list (emails included) as pasted into
      # Settings; when the secret is unset the test uses e2e/sources.txt
      - name: Sources end-to-end test (live archive.org)
        run: xvfb-run -a npm run test:e2e
        env:
          E2E_LIVE: '1'
          E2E_SOURCES: ${{ secrets.E2E_SOURCES }}

      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
