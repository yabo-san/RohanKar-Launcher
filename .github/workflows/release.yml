name: Release

# Every push to main updates a release PR with the next version and changelog,
# worked out from conventional commit messages (feat:, fix:, feat!: ...).
# Merging that PR tags the version and opens a draft release; the Windows
# installer is then built, smoke tested and attached to it, and the release is
# published as a pre-release. Nobody sees a release without its installer, and
# a build that fails the smoke test stays a draft.
# Last, a PR against gh-pages moves the beta update channel to the new version;
# stable only moves by a hand-made PR (see README, Releases).
on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          # A PAT or app token lets CI run on the release PR; GITHUB_TOKEN does not
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Rebuild native modules
        run: npx electron-builder install-app-deps

      # Build only; the upload step below is the single uploader
      - name: Build Windows installer
        run: npm run build -- --publish never

      # The installer build leaves the unpacked app in dist/win-unpacked; the
      # same packaged smoke test as CI's build check runs against it
      - name: Smoke test the built app
        env:
          E2E_APP: ${{ github.workspace }}\dist\win-unpacked\y4bo.exe
        run: npx playwright test

      - name: Upload smoke test report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: smoke-report
          path: |
            playwright-report/
            test-results/

      # Signed record that these files came from this workflow run;
      # check with `gh attestation verify` (see README, Releases)
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/*-Setup-*.exe
            dist/latest.yml

      - name: Attach installer to draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          gh release upload "$TAG" \
            dist/*-Setup-*.exe \
            dist/*-Setup-*.exe.blockmap \
            dist/latest.yml \
            --clobber

      # Pre-release, never "latest": stable is the gh-pages channel, moved by hand
      - name: Publish as a pre-release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh release edit "$TAG" --draft=false --prerelease --latest=false

      - name: Keep latest.yml for the beta channel PR
        uses: actions/upload-artifact@v4
        with:
          name: latest-yml
          path: dist/latest.yml

  beta-channel:
    needs: [release-please, build]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Download latest.yml
        uses: actions/download-artifact@v4
        with:
          name: latest-yml
          path: beta

      # electron-builder writes bare file names; the channel lives on Pages, so
      # point url/path at the release assets instead
      - name: Use absolute installer URLs
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          BASE="https://github.com/${{ github.repository }}/releases/download/$TAG"
          sed -i -E "s#^(\s*-?\s*(url|path): )([^/]+)\$#\1$BASE/\3#" beta/latest.yml
          cat beta/latest.yml

      - name: Open PR updating beta/latest.yml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          BRANCH="channel/beta-$TAG"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$BRANCH"
          git add beta/latest.yml
          git commit -m "chore: beta channel to $TAG"
          git push -u origin "$BRANCH"
          gh pr create --base gh-pages --head "$BRANCH" \
            --title "chore: beta channel to $TAG" \
            --body "Points beta/latest.yml at $TAG, published as a pre-release once its installer passed the smoke test. Merge to offer it to beta users. Stable stays where it is until a promotion PR copies beta/latest.yml to stable/latest.yml."
