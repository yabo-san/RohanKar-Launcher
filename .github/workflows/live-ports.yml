name: Live ports

# Real installs of Perfect Dark, Dusklight and Raze against the real GitHub and archive.org
# (scripts/live-port.js), which the fixture tests can only imitate. Not a
# required check: an upstream release or an archive.org outage can turn it red
# without anything in this repo being wrong.
on:
  pull_request:
    branches: [main]
    paths:
      - 'catalog/collisions.json'
      - 'scripts/live-port.js'
      - 'src/backend/installs.js'
      - 'src/backend/ports.js'
      - '.github/workflows/live-ports.yml'
  # Weekly, so an upstream release or archive.org change that breaks an install shows up
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
    inputs:
      repos:
        description: 'Repositories from catalog/collisions.json, space separated (default: Perfect Dark, Dusklight and Raze)'
        required: false
      ia:
        description: 'archive.org items to list, as item or item:regex, space separated'
        required: false
      zip:
        description: 'An archive.org archive to list the contents of, as item/file.zip'
        required: false

permissions:
  contents: read

jobs:
  install:
    # Windows is where the ports run: its job also tries starting each exe
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Install the ports for real
        shell: bash
        env:
          REPOS: ${{ inputs.repos }}
          # The TOSEC N64 set, for collisions that take a ROM from it, and Dusklight's data item
          IA: ${{ inputs.ia || 'N64TOSEC:(?i)perfect.dark twilight-princess-ddsk' }}
          # What Perfect Dark's TOSEC zip holds (its ROM's name says its byte order)
          ZIP: ${{ inputs.zip || 'N64TOSEC/Perfect Dark (USA) (Rev A).zip' }}
        run: node scripts/live-port.js $REPOS $(for i in $IA; do printf -- '--ia %s ' "$i"; done) --zip "$ZIP"
