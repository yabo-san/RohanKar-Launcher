name: Box art report

# Manual only: finds curated-artist SteamGridDB art for pstriple's archive.org
# items and opens one PR per batch that adds it to overrides.json (artUrl, plus
# hero where a 1920x620 exists), with cover previews in the PR body, and refreshes
# catalog/art.json (every grid and hero found per item). Never runs
# on push or PR, so PR checks never call archive.org. The script paces
# archive.org at 1 request/s and honours Retry-After; responses are cached
# across runs. Run from any branch other than main, it prints the overrides.json
# diff and commits only catalog/art.json back to that branch.
#
# Repo setting required: Actions > General > "Allow GitHub Actions to create
# and approve pull requests".
on:
  workflow_dispatch:
    inputs:
      grids:
        description: 'Only look up these SteamGridDB grid ids (space-separated) and print their image URL and artist'
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: box-art
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Look up grids
        if: inputs.grids != ''
        env:
          STEAMGRIDDB_API_KEY: ${{ secrets.STEAMGRIDDB_API_KEY }}
          GRIDS: ${{ inputs.grids }}
        run: |
          python3 scripts/box-art/grid-lookup.py $GRIDS | tee -a "$GITHUB_STEP_SUMMARY"

      # A new key each run saves the updated cache; restore-keys picks up the latest one.
      - name: Restore response cache
        if: inputs.grids == ''
        uses: actions/cache@v4
        with:
          path: scripts/box-art/cache
          key: box-art-cache-${{ github.run_id }}
          restore-keys: box-art-cache-

      - name: Find covers
        if: inputs.grids == ''
        env:
          STEAMGRIDDB_API_KEY: ${{ secrets.STEAMGRIDDB_API_KEY }}
        run: python3 scripts/box-art/pstriple-art.py

      # Also in the log and job summary, so the report can be read without downloading the artifact.
      - name: Show report
        if: inputs.grids == ''
        run: |
          cat scripts/box-art/pstriple-art.csv
          echo '--- candidates.csv ---'
          cat scripts/box-art/candidates.csv
          echo '--- overrides.json diff ---'
          git diff overrides.json
          echo '--- catalog/art.json ---'
          git diff --stat catalog/art.json
          cat scripts/box-art/batch.md >> "$GITHUB_STEP_SUMMARY"
          { echo '```csv'; cat scripts/box-art/pstriple-art.csv; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: inputs.grids == ''
        with:
          name: pstriple-art
          path: |
            scripts/box-art/pstriple-art.csv
            scripts/box-art/candidates.csv
            scripts/box-art/batch.md

      # On a branch, only the art catalog is committed back (overrides.json changes stay a dry run).
      - name: Commit art catalog to this branch
        if: github.ref != 'refs/heads/main' && inputs.grids == ''
        run: |
          if [ -z "$(git status --porcelain catalog/art.json)" ]; then
            echo "catalog/art.json unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add catalog/art.json
          git commit -m "chore: refresh catalog/art.json from SteamGridDB"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Open batch PR
        if: github.ref == 'refs/heads/main' && inputs.grids == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet overrides.json catalog/art.json; then
            echo "No new art; no PR."
            exit 0
          fi
          branch="box-art/batch-${{ github.run_number }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add overrides.json catalog/art.json
          git commit -m "feat: curated SteamGridDB art for pstriple's items (batch ${{ github.run_number }})"
          git push -u origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "feat: curated SteamGridDB art for pstriple's items (batch ${{ github.run_number }})" \
            --body-file scripts/box-art/batch.md
