name: Box art report

# Manual only: finds curated-artist SteamGridDB art for pstriple's archive.org
# items and opens one PR per batch that adds it to overrides.json (artUrl, plus
# hero where a 1920x620 exists), with cover previews in the PR body. Never runs
# on push or PR, so PR checks never call archive.org. The script paces
# archive.org at 1 request/s and honours Retry-After; responses are cached
# across runs. Run from any branch other than main, it only prints the diff.
#
# Repo setting required: Actions > General > "Allow GitHub Actions to create
# and approve pull requests".
on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: box-art
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Gravity Rush item metadata (one-off check)
        run: |
          for id in GRFork shadps-4-gr-2-branch; do
            echo "=== $id"
            curl -sS -A yabo "https://archive.org/metadata/$id" | python3 -c "
          import json,sys
          m=json.load(sys.stdin); md=m.get('metadata',{})
          for k in ('title','description','subject','date','addeddate'): print(k+':', md.get(k))
          for f in m.get('files',[]):
              if f.get('source')=='original': print('  file:', f.get('name'), f.get('size'))
          "
            sleep 1
          done
          exit 0
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # A new key each run saves the updated cache; restore-keys picks up the latest one.
      - name: Restore response cache
        uses: actions/cache@v4
        with:
          path: scripts/box-art/cache
          key: box-art-cache-${{ github.run_id }}
          restore-keys: box-art-cache-

      - name: Find covers
        env:
          STEAMGRIDDB_API_KEY: ${{ secrets.STEAMGRIDDB_API_KEY }}
        run: python3 scripts/box-art/pstriple-art.py

      # Also in the log and job summary, so the report can be read without downloading the artifact.
      - name: Show report
        run: |
          cat scripts/box-art/pstriple-art.csv
          echo '--- candidates.csv ---'
          cat scripts/box-art/candidates.csv
          echo '--- overrides.json diff ---'
          git diff overrides.json
          cat scripts/box-art/batch.md >> "$GITHUB_STEP_SUMMARY"
          { echo '```csv'; cat scripts/box-art/pstriple-art.csv; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: pstriple-art
          path: |
            scripts/box-art/pstriple-art.csv
            scripts/box-art/candidates.csv
            scripts/box-art/batch.md

      - name: Open batch PR
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet overrides.json; then
            echo "No new art; no PR."
            exit 0
          fi
          branch="box-art/batch-${{ github.run_number }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add overrides.json
          git commit -m "feat: curated SteamGridDB art for pstriple's items (batch ${{ github.run_number }})"
          git push -u origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "feat: curated SteamGridDB art for pstriple's items (batch ${{ github.run_number }})" \
            --body-file scripts/box-art/batch.md
